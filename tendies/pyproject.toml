[project]
name = "tendies"
version = "0.1.0"
description = "Scrape ESPN fantasy football league draft history and join it to market ADP, to profile each manager's draft tendencies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "playwright>=1.49",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tendies"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
